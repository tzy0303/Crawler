# 雲端每日抓取：GitHub Actions 跑爬蟲 → 資料庫存到 data 分支 → 發佈網頁到 GitHub Pages
# 安全：密碼只給用得到的步驟；安裝套件時不執行套件腳本、拿不到任何密碼或權杖；發佈網頁的權限另開一個 job
name: 每日抓取

on:
  schedule:
    - cron: '30 4 * * *'   # UTC 04:30 = 台灣 12:30（GitHub 排程可能延遲）
  workflow_dispatch:        # 家裡電腦推完 BeClass 後會用 site=beclass 呼叫（src/beclass-sync.js）
    inputs:
      site:
        description: '只抓某個網站 id（空白 = 全部啟用的網站；beclass = 只合併家裡電腦抓的資料）'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['sites.json', 'config.json', 'src/**', 'public/**', '.github/workflows/**']  # 新增/修改網站或程式後立刻跑一次

permissions: {}

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write   # 只用在「存回資料庫」推 data 分支
    outputs:
      crawl_outcome: ${{ steps.crawl.outcome }}
      beclass_age_days: ${{ steps.merge.outputs.age_days }}
    env:
      TZ: Asia/Taipei
      DB_FILE: ${{ github.workspace }}/db/crawler.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # 不把權杖留在 .git/config，後面的程式和套件讀不到

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      # 不執行套件的安裝腳本（目前的相依套件都不需要）；這一步沒有任何密碼
      - run: npm ci --ignore-scripts

      - name: 取回資料庫（data 分支）
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          # 沒有網站密碼就整個停下來：public repo 不能放未加密的資料
          if [ -z "$(echo "$SITE_PASSWORD" | tr -d '[:space:]')" ]; then
            echo "::error::沒有設定 SITE_PASSWORD（Settings → Secrets → Actions），停止，不發佈未加密資料"; exit 1
          fi
          mkdir -p db
          # 分辨「分支不存在」和「讀取失敗」：讀取失敗就停，不能從空資料庫開始再覆蓋掉舊資料
          set +e; git ls-remote --exit-code --heads origin data > /dev/null; rc=$?; set -e
          if [ $rc -eq 2 ]; then
            echo "還沒有 data 分支，從空資料庫開始"
          elif [ $rc -ne 0 ]; then
            echo "讀不到 data 分支，停止"; exit 1
          else
            git fetch --depth=1 origin data
            if git cat-file -e origin/data:crawler.db.enc 2>/dev/null; then
              git show origin/data:crawler.db.enc > db/crawler.db.enc
              node src/secure.js decrypt db/crawler.db.enc db/crawler.db
              rm db/crawler.db.enc
            else
              git show origin/data:crawler.db > db/crawler.db
            fi
            ls -la db
          fi
          # 記下原本的筆數，存回前用來檢查資料有沒有被寫壞
          echo "BEFORE_COUNT=$([ -f db/crawler.db ] && node src/db-count.js db/crawler.db || echo 0)" >> "$GITHUB_ENV"

      - name: 抓取
        id: crawl
        continue-on-error: true
        env:
          SITE: ${{ github.event.inputs.site }}
          # 104 職缺通知信（沒設定就略過）
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_MAILBOX: ${{ secrets.IMAP_MAILBOX }}
        run: |
          if [ "$SITE" = "beclass" ]; then
            echo "BeClass 由家裡電腦抓，這次只合併"
          elif [ -n "$SITE" ]; then
            node --disable-warning=ExperimentalWarning src/crawl.js --site "$SITE"
          else
            node --disable-warning=ExperimentalWarning src/crawl.js --skip beclass
          fi

      - name: 合併 BeClass（家裡電腦排程抓的，data-beclass 分支）
        id: merge
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if git fetch --depth=1 origin data-beclass; then
            # 家裡電腦多久沒推了（超過 3 天會通知）
            echo "age_days=$(( ($(date +%s) - $(git log -1 --format=%ct origin/data-beclass)) / 86400 ))" >> "$GITHUB_OUTPUT"
            git show origin/data-beclass:beclass.enc > db/beclass.enc
            node --disable-warning=ExperimentalWarning src/fragment.js merge db/beclass.enc
            rm -f db/beclass.enc
          else
            echo "還沒有 data-beclass 分支（家裡電腦還沒抓過），略過"
          fi

      - name: 補齊地點/地區
        run: node --disable-warning=ExperimentalWarning src/backfill.js

      - name: 存回資料庫（data 分支只保留最新一份）
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          # 雲端不會刪資料，筆數只會變多；少了 10% 以上表示資料庫被寫壞，停下來保留舊資料
          AFTER_COUNT=$(node src/db-count.js db/crawler.db)
          echo "活動筆數：$BEFORE_COUNT → $AFTER_COUNT"
          if [ "$AFTER_COUNT" -lt $(( BEFORE_COUNT * 9 / 10 )) ]; then
            echo "::error::活動筆數從 $BEFORE_COUNT 掉到 $AFTER_COUNT，資料可能被寫壞，不覆蓋 data 分支"; exit 1
          fi
          cd db
          rm -rf .git logs crawler.db-wal crawler.db-shm
          git init -q -b data
          # data 分支只放加密檔（public repo 也看不到內容）；secure.js 沒有密碼會失敗
          node ../src/secure.js encrypt crawler.db crawler.db.enc
          git add crawler.db.enc
          git -c user.name="crawler-bot" -c user.email="crawler-bot@users.noreply.github.com" commit -qm "data $(date '+%F %T')"
          git push -f "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git" data

      # 備份：每次的加密資料庫保留 7 天，寫壞時可以到這次執行的頁面下載還原
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crawler-db-${{ github.run_id }}
          path: db/crawler.db.enc
          retention-days: 7
          if-no-files-found: error

      - name: 匯出網頁
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          # 網站清單只需要知道「有沒有設定信箱」，不給信箱密碼
          MAIL104_CONFIGURED: ${{ secrets.IMAP_USER != '' && secrets.IMAP_PASSWORD != '' }}
        run: node --disable-warning=ExperimentalWarning src/export.js _site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  # 發佈網頁：只有這個 job 有 Pages 權限，而且不跑任何專案程式或套件
  deploy:
    needs: crawl
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # 出問題時開 Issue（GitHub 會寄信通知）；已經有未關閉的就留言，不重複開
  notify:
    needs: [crawl, deploy]
    if: >-
      always() && (needs.crawl.result != 'success' || needs.deploy.result != 'success'
      || needs.crawl.outputs.crawl_outcome == 'failure'
      || fromJSON(needs.crawl.outputs.beclass_age_days || '0') >= 3)
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CRAWL_JOB: ${{ needs.crawl.result }}
          CRAWL_STEP: ${{ needs.crawl.outputs.crawl_outcome }}
          DEPLOY_JOB: ${{ needs.deploy.result }}
          BECLASS_AGE: ${{ needs.crawl.outputs.beclass_age_days }}
        run: |
          {
            date '+%F %T'
            [ "$CRAWL_JOB" != "success" ] && echo "- 抓取流程失敗（資料沒有更新）"
            [ "$CRAWL_STEP" = "failure" ] && echo "- 有網站抓取失敗（其他網站照常更新）"
            [ "$DEPLOY_JOB" != "success" ] && echo "- 網頁沒有發佈"
            [ "${BECLASS_AGE:-0}" -ge 3 ] && echo "- BeClass 已經 ${BECLASS_AGE} 天沒更新（家裡電腦沒開機，或同步失敗：看家裡電腦的 data/logs）"
            echo
            echo "執行紀錄：$RUN_URL"
          } > body.md || true
          title="每日抓取有問題"
          n=$(gh issue list --state open --search "in:title $title" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file body.md
          else
            { echo "@$OWNER"; cat body.md; echo; echo "處理好之後請關閉這個 Issue。"; } > new.md
            gh issue create --title "$title" --body-file new.md
          fi
