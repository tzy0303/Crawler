# 雲端每日抓取：GitHub Actions 跑爬蟲 → 資料庫存到 data 分支 → 發佈網頁到 GitHub Pages
name: 每日抓取

on:
  schedule:
    - cron: '30 4 * * *'   # UTC 04:30 = 台灣 12:30（GitHub 排程可能延遲）
  workflow_dispatch:        # 家裡電腦推完 BeClass 後會用 site=beclass 呼叫（src/beclass-sync.js）
    inputs:
      site:
        description: '只抓某個網站 id（空白 = 全部啟用的網站；beclass = 只合併家裡電腦抓的資料）'
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['sites.json', 'config.json', 'src/**', 'public/**', '.github/workflows/**']  # 新增/修改網站或程式後立刻跑一次

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Taipei
      DB_FILE: ${{ github.workspace }}/db/crawler.db
      # 網站登入密碼：有設定時，網頁和 data 分支的資料都會加密（Settings → Secrets → SITE_PASSWORD）
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      # 104 職缺通知信（抓取和匯出都要用到；沒設定就略過）
      IMAP_USER: ${{ secrets.IMAP_USER }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      IMAP_HOST: ${{ secrets.IMAP_HOST }}
      IMAP_MAILBOX: ${{ secrets.IMAP_MAILBOX }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 取回資料庫（data 分支）
        run: |
          mkdir -p db
          if git fetch --depth=1 origin data; then
            if git cat-file -e origin/data:crawler.db.enc 2>/dev/null; then
              git show origin/data:crawler.db.enc > db/crawler.db.enc
              node src/secure.js decrypt db/crawler.db.enc db/crawler.db
              rm db/crawler.db.enc
            else
              git show origin/data:crawler.db > db/crawler.db
            fi
            ls -la db
          else
            echo "還沒有 data 分支，從空資料庫開始"
          fi

      - name: 抓取
        continue-on-error: true
        env:
          SITE: ${{ github.event.inputs.site }}
        run: |
          if [ "$SITE" = "beclass" ]; then
            echo "BeClass 由家裡電腦抓，這次只合併"
          elif [ -n "$SITE" ]; then
            node --disable-warning=ExperimentalWarning src/crawl.js --site "$SITE"
          else
            node --disable-warning=ExperimentalWarning src/crawl.js --skip beclass
          fi

      - name: 合併 BeClass（家裡電腦排程抓的，data-beclass 分支）
        run: |
          if git fetch --depth=1 origin data-beclass; then
            git show origin/data-beclass:beclass.enc > db/beclass.enc
            node --disable-warning=ExperimentalWarning src/fragment.js merge db/beclass.enc
            rm -f db/beclass.enc
          else
            echo "還沒有 data-beclass 分支（家裡電腦還沒抓過），略過"
          fi

      - name: 補齊地點/地區
        run: node --disable-warning=ExperimentalWarning src/backfill.js

      - name: 存回資料庫（data 分支只保留最新一份）
        run: |
          cd db
          rm -rf .git logs crawler.db-wal crawler.db-shm
          git init -q -b data
          if [ -n "$SITE_PASSWORD" ]; then
            # 有網站密碼：data 分支只放加密檔（public repo 也看不到內容）
            node ../src/secure.js encrypt crawler.db crawler.db.enc
            git add crawler.db.enc
          else
            git add crawler.db
          fi
          git -c user.name="crawler-bot" -c user.email="crawler-bot@users.noreply.github.com" commit -qm "data $(date '+%F %T')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: 匯出網頁
        run: node --disable-warning=ExperimentalWarning src/export.js _site

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
