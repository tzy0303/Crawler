<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 內容安全政策：只執行本站程式、只連本站和 GitHub API，外部注入的程式碼無法執行 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>活動更新爬蟲</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --text:#1f2328; --muted:#6b7280; --line:#e5e7eb; --soft:#f9fafb; --accent:#2563eb; --accent-soft:#eff6ff;
          --new:#16a34a; --upd:#d97706; --err:#dc2626; --shadow:0 1px 2px rgba(0,0,0,.04), 0 1px 8px rgba(0,0,0,.04); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#171a21; --text:#e6e8eb; --muted:#9aa3ad; --line:#2a2f3a; --soft:#1d212a; --accent:#5b8def; --accent-soft:#1c2740;
            --new:#22c55e; --upd:#f59e0b; --err:#f87171; --shadow:none; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.55 system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif; background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0 6px 0 0; white-space:nowrap; }
  .muted { color:var(--muted); font-size:12px; }
  .wrap { padding:16px; max-width:1500px; margin:0 auto; }
  .cards { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; margin-bottom:16px; }
  @media (max-width: 800px) { .cards { grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; box-shadow:var(--shadow); cursor:default; }
  .card.click { cursor:pointer; } .card.click:hover { border-color:var(--accent); }
  .card .n { font-size:24px; font-weight:700; line-height:1.2; }
  .card .l { font-size:12px; color:var(--muted); }
  main { display:grid; grid-template-columns: 290px minmax(0,1fr); gap:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } main section { order:-1; } }
  aside, section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; box-shadow:var(--shadow); }
  aside h3 { font-size:13px; margin:16px 0 6px; color:var(--muted); }
  aside h3:first-child { margin-top:0; }
  label { display:block; font-size:12px; color:var(--muted); margin-top:8px; }
  input, select, button { font:inherit; padding:6px 9px; border:1px solid var(--line); border-radius:7px; background:var(--card); color:var(--text); width:100%; }
  input:focus, select:focus { outline:2px solid var(--accent-soft); border-color:var(--accent); }
  .row { display:flex; gap:6px; } .row > * { flex:1; min-width:0; }
  button { cursor:pointer; width:auto; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.55; cursor:default; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { padding:3px 10px; border-radius:999px; font-size:12px; }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); white-space:nowrap; position:sticky; top:0; background:var(--card); }
  th[data-sort] { cursor:pointer; } th[data-sort]:hover { color:var(--accent); }
  td.t { white-space:nowrap; font-size:12px; }
  td.t .abs { color:var(--muted); font-size:11px; }
  #tbl tr:hover td { background:var(--soft); }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .badge { display:inline-block; font-size:11px; padding:0 7px; border-radius:10px; color:#fff; margin-right:4px; vertical-align:1px; }
  .b-new { background:var(--new); } .b-upd { background:var(--upd); }
  .hist { font-size:12px; border:1px solid var(--line); border-radius:999px; padding:1px 8px; background:var(--soft); color:var(--text); }
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap; }
  .toolbar .right { display:flex; gap:6px; flex-wrap:wrap; }
  .pager button { margin-left:4px; }
  .loading { padding:24px; text-align:center; color:var(--muted); }
  .empty { padding:28px 16px; text-align:center; color:var(--muted); }
  dialog { max-width:800px; width:94vw; border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--text); }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  dialog pre { white-space:pre-wrap; max-height:240px; overflow:auto; background:var(--soft); padding:8px; border-radius:6px; }
  .timeline { list-style:none; padding:0; margin:6px 0; }
  .timeline li { position:relative; padding:0 0 10px 18px; border-left:2px solid var(--line); margin-left:6px; }
  .timeline li::before { content:''; position:absolute; left:-6px; top:4px; width:10px; height:10px; border-radius:50%; background:var(--accent); }
  .timeline li.first::before { background:var(--new); } .timeline li.last { border-left-color:transparent; }
  .timeline li li { border:none; padding:0; margin:0 0 0 18px; list-style:disc; color:var(--muted); }
  .timeline li li::before { display:none; }
  td[data-l="地區"], td[data-l="縣市"] { white-space:nowrap; }
  .runs { font-size:12px; }
  .runs td { padding:4px 6px; }
  .tablewrap { overflow:auto; max-height:calc(100vh - 220px); }
  #sitesDlg { max-width:980px; }
  .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap:4px 12px; }
  @media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
  .form-grid .full { grid-column: 1 / -1; }
  .check { display:flex; gap:6px; align-items:center; color:var(--text); font-size:13px; }
  .check input { width:auto; }
  .hint { font-size:12px; color:var(--muted); margin:4px 0; }
  .err { color:var(--err); font-size:13px; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; margin-top:8px; }
  .actions button { padding:3px 8px; font-size:12px; }
  /* 手機：表格改卡片 */
  @media (max-width: 700px) {
    .tablewrap { max-height:none; }
    #tbl thead { display:none; }
    #tbl tr { display:block; border:1px solid var(--line); border-radius:10px; margin-bottom:10px; padding:8px 10px; }
    #tbl td { display:flex; gap:8px; border:none; padding:3px 0; }
    #tbl td[data-l]::before { content:attr(data-l); color:var(--muted); font-size:12px; min-width:64px; }
    #tbl td.name { display:block; font-size:15px; font-weight:600; }
  }
  #loginBox { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; }
  #loginBox[hidden] { display:none; }
  #loginBox form { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:24px; width:100%; max-width:340px; }
  #loginBox h2 { margin:0 0 4px; font-size:18px; }
  #loginBox button { width:100%; margin-top:12px; }
</style>
</head>
<body>
<header>
  <h1>活動更新爬蟲</h1>
  <select id="site" style="width:auto;max-width:280px"></select>
  <span id="status" class="muted"></span>
  <span style="flex:1"></span>
  <button id="logoutBtn" hidden>登出</button>
  <button id="sitesBtn">網站管理</button>
  <button id="crawlBtn" class="primary">立即抓取此網站</button>
</header>
<div class="wrap">
  <div class="cards">
    <div class="card click" data-quick="all" title="顯示全部"><div class="n" id="c_total">–</div><div class="l">總筆數</div></div>
    <div class="card click" data-quick="today" title="只看今天新增"><div class="n" id="c_new" style="color:var(--new)">–</div><div class="l">今天新增</div></div>
    <div class="card click" data-quick="todayupd" title="只看今天更新"><div class="n" id="c_upd" style="color:var(--upd)">–</div><div class="l">今天更新</div></div>
    <div class="card"><div class="n" id="c_run" style="font-size:15px">–</div><div class="l" id="c_run_l">最近一次抓取</div></div>
  </div>
  <main>
    <aside>
      <h3>快速篩選</h3>
      <div class="chips" id="quick">
        <button class="chip" data-quick="all">全部</button>
        <button class="chip" data-quick="today">今天新增</button>
        <button class="chip" data-quick="week">近 7 天新增</button>
        <button class="chip" data-quick="todayupd">今天更新</button>
        <button class="chip" data-quick="updated">有更新過</button>
      </div>
      <h3>共同條件</h3>
      <label>名稱 / 說明關鍵字</label><input id="q" placeholder="例如：健行">
      <label>首次出現</label><div class="row"><input type="date" id="created_from"><input type="date" id="created_to"></div>
      <label>最新更新</label><div class="row"><input type="date" id="updated_from"><input type="date" id="updated_to"></div>
      <label>變動</label>
      <select id="kind">
        <option value="">全部</option>
        <option value="lastnew">最近一次抓取新增</option>
        <option value="lastupd">最近一次抓取修改</option>
        <option value="updated">曾經修改過</option>
      </select>
      <h3>網站欄位（依網站自動產生）</h3>
      <div id="dynFilters"><span class="muted">尚無資料，先抓取一次</span></div>
      <div class="row" style="margin-top:12px"><button id="apply" class="primary">篩選</button><button id="reset">清除</button></div>
      <h3>最近抓取紀錄</h3>
      <table class="runs" id="runs"></table>
    </aside>
    <section>
      <div class="toolbar">
        <span id="summary" class="muted"></span>
        <span class="right"><button id="dlCsv" title="下載目前篩選結果（含首次出現、最新更新、歷史時間點）">下載 CSV</button><button id="dlJson" title="歷史時間點是陣列">下載 JSON</button><span class="pager" id="pager"></span></span>
      </div>
      <div class="tablewrap"><table id="tbl"></table></div>
    </section>
  </main>
</div>
<div id="loginBox" hidden>
  <form id="loginForm">
    <h2>活動更新爬蟲</h2>
    <p class="muted" style="margin:0 0 12px">請輸入密碼才能查看</p>
    <input type="password" id="loginPw" autocomplete="current-password" placeholder="密碼">
    <label class="check" style="margin-top:10px"><input type="checkbox" id="loginRemember"> 記住這台裝置 30 天（只存金鑰，不存密碼）</label>
    <button class="primary" id="loginBtn">登入</button>
    <div id="loginErr" class="err" style="margin-top:8px"></div>
  </form>
</div>
<dialog id="dlg"><div id="dlgBody"></div><form method="dialog" style="text-align:right"><button>關閉</button></form></dialog>
<dialog id="sitesDlg">
  <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">網站管理</h3><button id="sitesClose">關閉</button></div>
  <div class="tablewrap"><table id="siteTbl" style="margin-top:8px"></table></div>
  <h3 id="formTitle" style="margin-top:20px">新增網站</h3>
  <p class="hint">填好名稱和列表網址後直接儲存。設定會寫進 GitHub 的 sites.json 並自動開始抓取，活動連結和分頁會自動判斷，約 2～10 分鐘後重新整理頁面就看得到。第一次修改時會要求輸入 GitHub 權杖。<a href="#" id="clearToken">清除已存的權杖</a></p>
  <div class="form-grid">
    <div><label>網站名稱</label><input id="sf_name" placeholder="例如：華山文創活動"></div>
    <div><label>列表網址（頁碼用 {page}）</label><input id="sf_listUrl" placeholder="https://example.com/events?page={page}"></div>
    <div class="full"><label>活動連結規則（# = 數字、* = 任意一段）</label><input id="sf_linkPattern" placeholder="可留空，抓取時自動判斷"></div>
    <div class="full"><label>預設地點（選填：所有活動都在同一處時填，例如「華山1914文化創意產業園區（臺北市中正區八德路一段1號）」）</label><input id="sf_defaultLocation" placeholder="活動頁沒寫地點時使用"></div>
    <div><label>每次最多抓幾頁</label><input type="number" id="sf_maxPages" value="5" min="1" max="100"></div>
    <div><label>&nbsp;</label><label class="check"><input type="checkbox" id="sf_fetchDetail" checked> 進入每個活動的詳細頁抓欄位（較完整，但比較慢）</label></div>
    <div class="full"><details><summary>進階設定</summary><div class="form-grid">
      <div><label>標題 CSS 選擇器（選填）</label><input id="sf_titleSelector" placeholder="例如 h1.title"></div>
      <div><label>內容區 CSS 選擇器（選填）</label><input id="sf_contentSelector" placeholder="例如 .event-content"></div>
      <div class="full"><label>每天會變的欄位（逗號分隔，變動不算修改，例如：剩餘名額, 瀏覽次數）</label><input id="sf_volatile"></div>
      <div><label>編碼</label><select id="sf_encoding"><option value="auto">自動</option><option value="utf-8">UTF-8</option><option value="big5">Big5</option></select></div>
      <div><label>&nbsp;</label><label class="check"><input type="checkbox" id="sf_trackDescription"> 內文有變也算「修改」（建議搭配內容區選擇器）</label></div>
    </div></details></div>
    <div class="full row" style="justify-content:flex-end;margin-top:8px"><span id="sf_msg" style="flex:1"></span><button id="sf_cancel" style="flex:0 0 auto">清除</button><button id="sf_save" class="primary" style="flex:0 0 auto">儲存網站</button></div>
  </div>
</dialog>
<script src="app.js"></script>
</body>
</html>
